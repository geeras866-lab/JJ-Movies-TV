              private void startApkUpdateDownload(String apkUrl) {
                  if (isDownloadingUpdate) return;
                  isDownloadingUpdate = true;

                  Dialog progDialog = new Dialog(this);
                  progDialog.requestWindowFeature(Window.FEATURE_NO_TITLE);
                  progDialog.setCancelable(false);
                  if (progDialog.getWindow() != null) {
                      progDialog.getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                  }

                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setBackgroundResource(R.drawable.bg_buffering_card);
                  box.setPadding(64, 48, 64, 48);

                  ProgressBar pb = new ProgressBar(this);
                  box.addView(pb);

                  TextView statusTv = new TextView(this);
                  statusTv.setText("Downloading Update... 0%");
                  statusTv.setTextColor(Color.WHITE);
                  statusTv.setTextSize(15f);
                  statusTv.setTypeface(null, Typeface.BOLD);
                  LinearLayout.LayoutParams stLp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  stLp.topMargin = 24;
                  box.addView(statusTv, stLp);

                  progDialog.setContentView(box);
                  progDialog.show();

                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          String currentUrl = apkUrl;
                          for (int redirects = 0; redirects < 6; redirects++) {
                              conn = (HttpURLConnection) new URL(currentUrl).openConnection();
                              conn.setInstanceFollowRedirects(true);
                              conn.setConnectTimeout(15000);
                              conn.setReadTimeout(30000);
                              conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Android TV)");
                              int code = conn.getResponseCode();
                              if (code == HttpURLConnection.HTTP_MOVED_PERM || code == HttpURLConnection.HTTP_MOVED_TEMP || code == 303 || code == 307 || code == 308) {
                                  String next = conn.getHeaderField("Location");
                                  conn.disconnect();
                                  if (next == null || next.isEmpty()) break;
                                  currentUrl = next;
                                  continue;
                              }
                              break;
                          }

                          if (conn == null || conn.getResponseCode() >= 400) {
                              throw new Exception("Download failed");
                          }

                          long total = conn.getContentLength();
                          File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                          if (dir == null) dir = getCacheDir();
                          File outFile = new File(dir, "jj-movies-tv-update.apk");
                          if (outFile.exists()) outFile.delete();

                          try (InputStream in = conn.getInputStream();
                               FileOutputStream out = new FileOutputStream(outFile)) {
                              byte[] buf = new byte[8192];
                              long downloaded = 0;
                              int n;
                              int lastPct = -1;
                              while ((n = in.read(buf)) != -1) {
                                  out.write(buf, 0, n);
                                  downloaded += n;
                                  if (total > 0) {
                                      int pct = (int) ((downloaded * 100L) / total);
                                      if (pct != lastPct) {
                                          lastPct = pct;
                                          final int showPct = pct;
                                          runOnUiThread(() -> statusTv.setText("Downloading Update... " + showPct + "%"));
                                      }
                                  }
                              }
                          }

                          runOnUiThread(() -> {
                              isDownloadingUpdate = false;
                              if (progDialog.isShowing()) progDialog.dismiss();
                              installDownloadedApk(outFile);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              isDownloadingUpdate = false;
                              if (progDialog.isShowing()) progDialog.dismiss();
                              Toast.makeText(MainActivity.this, "Opening update link...", Toast.LENGTH_SHORT).show();
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(apkUrl)));
                              } catch (Exception ignored) {}
                          });
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  }).start();
              }

              private void installDownloadedApk(File apkFile) {
                  try {
                      Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", apkFile);
                      Intent install = new Intent(Intent.ACTION_VIEW);
                      install.setDataAndType(uri, "application/vnd.android.package-archive");
                      install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(install);
                  } catch (Exception e) {
                      Toast.makeText(this, "Enable Install Unknown Apps for JJ Movies TV", Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemUi();

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.BLACK);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setUserAgentString("Mozilla/5.0 (Linux; Android 11; Android TV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36 JJTV");

                  TvBridge bridge = new TvBridge();
                  webView.addJavascriptInterface(bridge, "AndroidVlc");
                  webView.addJavascriptInterface(bridge, "AndroidTV");

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectLocalTvAssets();
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest req, WebResourceError err) {
                          if (req != null && req.isForMainFrame()) {
                              String offlineHtml = "<html><body style='background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;'>"
                                  + "<h2 style='color:#e50914;'>No Internet Connection</h2>"
                                  + "<p style='color:#94a3b8;'>Check your Wi-Fi or Ethernet and press OK to retry.</p>"
                                  + "<button autofocus onclick=\"location.href='" + SITE_URL + "'\" style='margin-top:16px;padding:12px 28px;background:#e50914;color:#fff;border:0;border-radius:8px;font-weight:bold;font-size:16px;'>Retry</button>"
                                  + "</body></html>";
                              view.loadDataWithBaseURL(null, offlineHtml, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  webView.requestFocus();
                  webView.loadUrl(SITE_URL);
              }

              private String readAssetBase64(String fileName) {
                  try (InputStream is = getAssets().open(fileName);
                       ByteArrayOutputStream baos = new ByteArrayOutputStream()) {
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = is.read(buf)) != -1) {
                          baos.write(buf, 0, n);
                      }
                      return Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                  } catch (Exception ignored) {}
                  return "";
              }

              private void injectLocalTvAssets() {
                  String cssB64 = readAssetBase64("tv.css");
                  String jsB64 = readAssetBase64("tv.js");
                  if (cssB64.isEmpty() || jsB64.isEmpty()) return;

                  String loader = "(function(){"
