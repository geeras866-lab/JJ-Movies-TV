      - name: 3. Setup MainActivity & Native LibVLC Player
        run: |
          cat << 'EOF' > app/src/main/java/com/jjmovies/tv/MainActivity.java
          package com.jjmovies.tv;

          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.InputStream;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private static final String SITE_URL = "https://jj-movies.pages.dev/?tv=1";

              public class TvBridge {
                  @JavascriptInterface
                  public void playVideo(String url) {
                      playVideo(url, "JJ Movies TV");
                  }

                  @JavascriptInterface
                  public void playVideo(String url, String title) {
                      if (url == null || url.trim().isEmpty()) return;
                      runOnUiThread(() -> {
                          Intent intent = new Intent(MainActivity.this, VlcPlayerActivity.class);
                          intent.putExtra(VlcPlayerActivity.EXTRA_VIDEO_URL, url.trim());
                          intent.putExtra(VlcPlayerActivity.EXTRA_VIDEO_TITLE, title != null ? title : "JJ Movies TV");
                          startActivity(intent);
                      });
                  }

                  @JavascriptInterface
                  public int getAppVersionCode() {
                      try {
                          return getPackageManager().getPackageInfo(getPackageName(), 0).versionCode;
                      } catch (Exception e) {
                          return 1;
                      }
                  }
              }

              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemUi();

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.BLACK);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setUserAgentString("Mozilla/5.0 (Linux; Android 11; Android TV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36 JJTV");

                  TvBridge bridge = new TvBridge();
                  webView.addJavascriptInterface(bridge, "AndroidVlc");
                  webView.addJavascriptInterface(bridge, "AndroidTV");

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectLocalTvAssets();
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest req, WebResourceError err) {
                          if (req != null && req.isForMainFrame()) {
                              String offlineHtml = "<html><body style='background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;'>"
                                  + "<h2 style='color:#e50914;'>No Internet Connection</h2>"
                                  + "<p style='color:#94a3b8;'>Check your Wi-Fi or Ethernet and press OK to retry.</p>"
                                  + "<button autofocus onclick=\"location.href='" + SITE_URL + "'\" style='margin-top:16px;padding:12px 28px;background:#e50914;color:#fff;border:0;border-radius:8px;font-weight:bold;font-size:16px;'>Retry</button>"
                                  + "</body></html>";
                              view.loadDataWithBaseURL(null, offlineHtml, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  webView.requestFocus();
                  webView.loadUrl(SITE_URL);
              }

              private String readAssetBase64(String fileName) {
                  try (InputStream is = getAssets().open(fileName)) {
                      byte[] buf = new byte[is.available()];
                      int read = is.read(buf);
                      if (read > 0) {
                          return Base64.encodeToString(buf, 0, read, Base64.NO_WRAP);
                      }
                  } catch (Exception ignored) {}
                  return "";
              }

              private void injectLocalTvAssets() {
                  String cssB64 = readAssetBase64("tv.css");
                  String jsB64 = readAssetBase64("tv.js");
                  if (cssB64.isEmpty() || jsB64.isEmpty()) return;

                  String loader = "(function(){"
                      + "if(window.__JJ_TV_UI_LOADED) return;"
                      + "function b64Decode(b){return new TextDecoder().decode(Uint8Array.from(atob(b),function(c){return c.charCodeAt(0);}));}"
                      + "var st=document.createElement('style');st.textContent=b64Decode('" + cssB64 + "');document.head.appendChild(st);"
                      + "var sc=document.createElement('script');sc.textContent=b64Decode('" + jsB64 + "');document.body.appendChild(sc);"
                      + "})();";
                  webView.evaluateJavascript(loader, null);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      webView.evaluateJavascript("window.handleTvBack ? window.handleTvBack() : 'exit'", val -> {
                          if (val == null || val.contains("exit")) {
                              finish();
                          }
                      });
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  hideSystemUi();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/jjmovies/tv/VlcPlayerActivity.java
          package com.jjmovies.tv;

          import android.app.AlertDialog;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.ImageButton;
          import android.widget.LinearLayout;
          import android.widget.RelativeLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import org.videolan.libvlc.LibVLC;
          import org.videolan.libvlc.Media;
          import org.videolan.libvlc.MediaPlayer;
          import org.videolan.libvlc.util.VLCVideoLayout;
          import java.util.ArrayList;
          import java.util.Locale;

          public class VlcPlayerActivity extends AppCompatActivity {

              public static final String EXTRA_VIDEO_URL = "video_url";
              public static final String EXTRA_VIDEO_TITLE = "video_title";

              private LibVLC libVLC;
              private MediaPlayer mediaPlayer;
              private VLCVideoLayout videoLayout;
              private RelativeLayout controlsOverlay;
              private LinearLayout loadingBox;
              private SeekBar seekBar;
              private TextView tvCurrentTime, tvTotalTime, tvTitle, tvBufferingText;
              private ImageButton btnPlayPause;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean isUserSeeking = false;
              private boolean controlsVisible = true;
              private int aspectMode = 0;

              private final MediaPlayer.ScaleType[] scaleTypes = {
                  MediaPlayer.ScaleType.SURFACE_BEST_FIT,
                  MediaPlayer.ScaleType.SURFACE_FILL,
                  MediaPlayer.ScaleType.SURFACE_FIT_SCREEN,
                  MediaPlayer.ScaleType.SURFACE_16_9
              };
              private final String[] scaleNames = { "Best Fit", "Fill Screen", "Zoom / Crop", "16:9" };

              private final Runnable hideControlsRunnable = () -> {
                  if (controlsOverlay != null && mediaPlayer != null && mediaPlayer.isPlaying()) {
                      controlsOverlay.setVisibility(View.GONE);
                      controlsVisible = false;
                      hideSystemUi();
                  }
              };

              private final Runnable progressUpdater = new Runnable() {
                  @Override
                  public void run() {
                      if (mediaPlayer != null && !isUserSeeking) {
                          long total = mediaPlayer.getLength();
                          long current = mediaPlayer.getTime();
                          if (total > 0) {
                              seekBar.setMax((int) total);
                              seekBar.setProgress((int) Math.max(0, current));
                              tvCurrentTime.setText(formatTime(current));
                              tvTotalTime.setText(formatTime(total));
                          }
                      }
                      handler.postDelayed(this, 500);
                  }
              };

              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }

              private void showControls() {
                  if (controlsOverlay != null) {
                      controlsOverlay.setVisibility(View.VISIBLE);
                      controlsVisible = true;
                  }
                  scheduleHideControls();
              }

              private void scheduleHideControls() {
                  handler.removeCallbacks(hideControlsRunnable);
                  handler.postDelayed(hideControlsRunnable, 4500);
              }

              private String formatTime(long ms) {
                  if (ms <= 0) return "0:00";
                  long totalSec = ms / 1000;
                  long hours = totalSec / 3600;
                  long mins = (totalSec % 3600) / 60;
                  long secs = totalSec % 60;
                  if (hours > 0) {
                      return String.format(Locale.US, "%d:%02d:%02d", hours, mins, secs);
                  }
                  return String.format(Locale.US, "%d:%02d", mins, secs);
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemUi();
                  setContentView(R.layout.activity_vlc_player);

                  String videoUrl = getIntent().getStringExtra(EXTRA_VIDEO_URL);
                  String videoTitle = getIntent().getStringExtra(EXTRA_VIDEO_TITLE);
                  if (videoUrl == null || videoUrl.trim().isEmpty()) {
                      Toast.makeText(this, "Invalid video URL", Toast.LENGTH_SHORT).show();
                      finish();
                      return;
                  }

                  videoLayout = findViewById(R.id.vlc_video_layout);
                  controlsOverlay = findViewById(R.id.controls_overlay);
                  loadingBox = findViewById(R.id.vlc_loading_box);
                  tvBufferingText = findViewById(R.id.tv_buffering_text);
                  seekBar = findViewById(R.id.vlc_seekbar);
                  tvCurrentTime = findViewById(R.id.tv_current_time);
                  tvTotalTime = findViewById(R.id.tv_total_time);
                  tvTitle = findViewById(R.id.tv_video_title);
                  btnPlayPause = findViewById(R.id.btn_play_pause);

                  ImageButton btnBack = findViewById(R.id.btn_back);
                  ImageButton btnTracks = findViewById(R.id.btn_tracks);
                  ImageButton btnAspect = findViewById(R.id.btn_aspect);

                  if (tvTitle != null && videoTitle != null && !videoTitle.trim().isEmpty()) {
                      tvTitle.setText(videoTitle.trim());
                  }

                  ArrayList<String> options = new ArrayList<>();
                  options.add("--audio-time-stretch");
                  options.add("--network-caching=3000");
                  options.add("--file-caching=1500");
                  options.add("--http-reconnect");

                  libVLC = new LibVLC(this, options);
                  mediaPlayer = new MediaPlayer(libVLC);
                  mediaPlayer.attachViews(videoLayout, null, false, false);

                  mediaPlayer.setEventListener(event -> runOnUiThread(() -> {
                      if (event.type == MediaPlayer.Event.Playing) {
                          loadingBox.setVisibility(View.GONE);
                          btnPlayPause.setImageResource(R.drawable.ic_vlc_pause);
                          scheduleHideControls();
                      } else if (event.type == MediaPlayer.Event.Paused) {
                          btnPlayPause.setImageResource(R.drawable.ic_vlc_play);
                          showControls();
                      } else if (event.type == MediaPlayer.Event.Buffering) {
                          float buf = event.getBuffering();
                          if (buf >= 100f) {
                              loadingBox.setVisibility(View.GONE);
                          } else {
                              loadingBox.setVisibility(View.VISIBLE);
                              if (tvBufferingText != null) {
                                  tvBufferingText.setText("Buffering " + Math.max(0, (int) buf) + "%");
                              }
                          }
                      } else if (event.type == MediaPlayer.Event.EncounteredError) {
                          loadingBox.setVisibility(View.GONE);
                          Toast.makeText(this, "Playback error. Try Server 2.", Toast.LENGTH_LONG).show();
                      }
                  }));

                  String safeUrl = videoUrl.trim().replace(" ", "%20").replace("(", "%28").replace(")", "%29");
                  Media media = new Media(libVLC, Uri.parse(safeUrl));
                  media.setHWDecoderEnabled(true, true);
                  media.addOption(":network-caching=3000");
                  media.addOption(":http-reconnect");
                  mediaPlayer.setMedia(media);
                  media.release();

                  mediaPlayer.play();
                  handler.post(progressUpdater);
                  scheduleHideControls();

                  if (btnBack != null) btnBack.setOnClickListener(v -> finish());
                  if (btnTracks != null) btnTracks.setOnClickListener(v -> { showControls(); showTracksMenu(); });
                  if (btnPlayPause != null) {
                      btnPlayPause.setOnClickListener(v -> { togglePlayPause(); scheduleHideControls(); });
                      btnPlayPause.requestFocus();
                  }
                  if (btnAspect != null) {
                      btnAspect.setOnClickListener(v -> {
                          aspectMode = (aspectMode + 1) % scaleTypes.length;
                          mediaPlayer.setVideoScale(scaleTypes[aspectMode]);
                          Toast.makeText(this, scaleNames[aspectMode], Toast.LENGTH_SHORT).show();
                          scheduleHideControls();
                      });
                  }

                  seekBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar sb, int progress, boolean fromUser) {
                          if (fromUser) tvCurrentTime.setText(formatTime(progress));
                      }
                      @Override
                      public void onStartTrackingTouch(SeekBar sb) {
                          isUserSeeking = true;
                          handler.removeCallbacks(hideControlsRunnable);
                      }
                      @Override
                      public void onStopTrackingTouch(SeekBar sb) {
                          isUserSeeking = false;
                          if (mediaPlayer != null) mediaPlayer.setTime(sb.getProgress());
                          scheduleHideControls();
                      }
                  });
              }

              private void togglePlayPause() {
                  if (mediaPlayer == null) return;
                  if (mediaPlayer.isPlaying()) {
                      mediaPlayer.pause();
                      btnPlayPause.setImageResource(R.drawable.ic_vlc_play);
                  } else {
                      mediaPlayer.play();
                      btnPlayPause.setImageResource(R.drawable.ic_vlc_pause);
                  }
              }

              private void seekBy(long deltaMs) {
                  if (mediaPlayer == null) return;
                  long target = mediaPlayer.getTime() + deltaMs;
                  mediaPlayer.setTime(Math.max(0L, target));
              }

              private void showTracksMenu() {
                  String[] opts = { "Audio Track (Dolby / Language)", "Subtitles" };
                  new AlertDialog.Builder(this)
                      .setTitle("Audio & Subtitles")
                      .setItems(opts, (d, which) -> {
                          if (which == 0) showAudioTrackDialog();
                          else showSubtitleTrackDialog();
                      })
                      .show();
              }

              private void showAudioTrackDialog() {
                  if (mediaPlayer == null) return;
                  MediaPlayer.TrackDescription[] tracks = mediaPlayer.getAudioTracks();
                  if (tracks == null || tracks.length == 0) {
                      Toast.makeText(this, "Audio tracks loading...", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  String[] names = new String[tracks.length];
                  int currentId = mediaPlayer.getAudioTrack();
                  int checkedIndex = 0;
                  for (int i = 0; i < tracks.length; i++) {
                      names[i] = tracks[i].name != null ? tracks[i].name : ("Audio Track " + i);
                      if (tracks[i].id == currentId) checkedIndex = i;
                  }
                  new AlertDialog.Builder(this)
                      .setTitle("Select Audio Track")
                      .setSingleChoiceItems(names, checkedIndex, (dialog, which) -> {
                          mediaPlayer.setAudioTrack(tracks[which].id);
                          Toast.makeText(this, "Audio: " + names[which], Toast.LENGTH_SHORT).show();
                          dialog.dismiss();
                      })
                      .show();
              }

              private void showSubtitleTrackDialog() {
                  if (mediaPlayer == null) return;
                  MediaPlayer.TrackDescription[] tracks = mediaPlayer.getSpuTracks();
                  if (tracks == null || tracks.length == 0) {
                      Toast.makeText(this, "No subtitles available", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  String[] names = new String[tracks.length];
                  int currentId = mediaPlayer.getSpuTrack();
                  int checkedIndex = 0;
                  for (int i = 0; i < tracks.length; i++) {
                      names[i] = tracks[i].name != null ? tracks[i].name : ("Subtitle " + i);
                      if (tracks[i].id == currentId) checkedIndex = i;
                  }
                  new AlertDialog.Builder(this)
                      .setTitle("Select Subtitles")
                      .setSingleChoiceItems(names, checkedIndex, (dialog, which) -> {
                          mediaPlayer.setSpuTrack(tracks[which].id);
                          Toast.makeText(this, "Subtitle: " + names[which], Toast.LENGTH_SHORT).show();
                          dialog.dismiss();
                      })
                      .show();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (mediaPlayer != null) {
                      if (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER || keyCode == KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE) {
                          togglePlayPause();
                          showControls();
                          return true;
                      }
                      if (keyCode == KeyEvent.KEYCODE_DPAD_RIGHT || keyCode == KeyEvent.KEYCODE_MEDIA_FAST_FORWARD) {
                          seekBy(10000L);
                          Toast.makeText(this, "+10s", Toast.LENGTH_SHORT).show();
                          showControls();
                          return true;
                      }
                      if (keyCode == KeyEvent.KEYCODE_DPAD_LEFT || keyCode == KeyEvent.KEYCODE_MEDIA_REWIND) {
                          seekBy(-10000L);
                          Toast.makeText(this, "-10s", Toast.LENGTH_SHORT).show();
                          showControls();
                          return true;
                      }
                      if (keyCode == KeyEvent.KEYCODE_DPAD_UP || keyCode == KeyEvent.KEYCODE_MENU) {
                          showControls();
                          showTracksMenu();
                          return true;
                      }
                      if (keyCode == KeyEvent.KEYCODE_DPAD_DOWN) {
                          showControls();
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (mediaPlayer != null) mediaPlayer.stop();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  handler.removeCallbacksAndMessages(null);
                  if (mediaPlayer != null) {
                      mediaPlayer.detachViews();
                      mediaPlayer.release();
                      mediaPlayer = null;
                  }
                  if (libVLC != null) {
                      libVLC.release();
                      libVLC = null;
                  }
              }
          }
