name: Build JJ Movies TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Android TV versionCode (integer, e.g. 1)"
        required: true
        default: "1"

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare Web Assets for JJ Movies TV
        run: |
          mkdir -p www
          for f in *; do
            case "$f" in
              www|android|node_modules|.git|.github|assets|capacitor.config.json) continue ;;
              *.apk|*.aab|*.zip|*.keystore|*.jks) continue ;;
              *)
                if [ -e "$f" ]; then
                  cp -r "$f" www/
                fi
                ;;
            esac
          done

          if [ ! -f "www/index.html" ]; then
            FOUND_HTML=$(find . -maxdepth 3 -name "index.html" -not -path "./www/*" -not -path "./android/*" -not -path "./node_modules/*" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              cp -r "$(dirname "$FOUND_HTML")/." www/
            else
              cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>JJ Movies TV</title>
          </head>
          <body style="background:#000;color:#fff;font-family:sans-serif;">
            <div id="app"></div>
            <script src="./app.js"></script>
          </body>
          </html>
          EOF
            fi
          fi

          rm -f www/package.json www/package-lock.json
          if [ ! -f package.json ]; then
            npm init -y >/dev/null 2>&1
          fi
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/screen-orientation@7

      - name: Initialize or Update Android TV Capacitor Project
        run: |
          VER_NAME="${{ github.event.inputs.app_version || '1.0.0' }}"
          VER_CODE="${{ github.event.inputs.version_code || '1' }}"

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.jjmovies.tv",
            "appName": "JJ Movies TV",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap copy android

          if [ -d "assets" ]; then
            npm install --no-save @capacitor/assets || true
            npx capacitor-assets generate --android --iconBackgroundColor '#080d18' --splashBackgroundColor '#080d18' || true
          fi

          STR="android/app/src/main/res/values/strings.xml"
          if [ -f "$STR" ]; then
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">JJ Movies TV</string>|' "$STR"
            sed -i 's|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">JJ Movies TV</string>|' "$STR"
          fi

      - name: Configure TV Manifest, FileProvider, Gradle & Native LibVLC Player
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="." />
              <cache-path name="cache" path="." />
          </paths>
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:banner="@mipmap/ic_launcher"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:launchMode="singleTask"
                      android:name=".MainActivity"
                      android:theme="@style/AppTheme.NoActionBarLaunch">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".VlcPlayerActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|uiMode"
                      android:exported="false"
                      android:screenOrientation="landscape"
                      android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>

          </manifest>
          EOF

          PKG_DIR="android/app/src/main/java/com/jjmovies/tv"
          mkdir -p "$PKG_DIR"

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.jjmovies.tv;

          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private WebView jjWebView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      jjWebView = getBridge().getWebView();
                      WebSettings ws = jjWebView.getSettings();
                      ws.setJavaScriptEnabled(true);
                      ws.setDomStorageEnabled(true);
                      ws.setMediaPlaybackRequiresUserGesture(false);
                      String ua = ws.getUserAgentString();
                      if (ua != null && !ua.contains("JJTV")) {
                          ws.setUserAgentString(ua + " JJTV");
                      }
                      jjWebView.addJavascriptInterface(new TvVlcBridge(), "AndroidVlc");
                  }
              }

              public class TvVlcBridge {
                  @JavascriptInterface
                  public void playVideo(String url, String title) {
                      if (url == null || url.trim().isEmpty()) return;
                      runOnUiThread(() -> {
                          Intent intent = new Intent(MainActivity.this, VlcPlayerActivity.class);
                          intent.putExtra("video_url", url.trim());
                          intent.putExtra("video_title", title != null ? title : "JJ Movies TV");
                          startActivity(intent);
                      });
                  }

                  @JavascriptInterface
                  public int getAppVersionCode() {
                      try {
                          return getPackageManager().getPackageInfo(getPackageName(), 0).versionCode;
                      } catch (Exception e) {
                          return 1;
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/VlcPlayerActivity.java"
          package com.jjmovies.tv;

          import android.app.Activity;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import org.videolan.libvlc.LibVLC;
          import org.videolan.libvlc.Media;
          import org.videolan.libvlc.MediaPlayer;
          import org.videolan.libvlc.util.VLCVideoLayout;
          import java.util.ArrayList;

          public class VlcPlayerActivity extends Activity {

              private LibVLC libVlc;
              private MediaPlayer mediaPlayer;
              private VLCVideoLayout videoLayout;
              private TextView titleView;
              private TextView timeView;
              private SeekBar seekBar;
              private LinearLayout controlsBar;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean isSeeking = false;

              private final Runnable progressRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (mediaPlayer != null && mediaPlayer.isPlaying() && !isSeeking) {
                          long length = mediaPlayer.getLength();
                          long time = mediaPlayer.getTime();
                          if (length > 0 && time >= 0) {
                              int prog = (int) ((time * 1000L) / length);
                              seekBar.setProgress(Math.max(0, Math.min(1000, prog)));
                              timeView.setText(formatMs(time) + " / " + formatMs(length));
                          }
                      }
                      handler.postDelayed(this, 500);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  String videoUrl = getIntent().getStringExtra("video_url");
                  String videoTitle = getIntent().getStringExtra("video_title");

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  videoLayout = new VLCVideoLayout(this);
                  root.addView(videoLayout, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  ));

                  controlsBar = new LinearLayout(this);
                  controlsBar.setOrientation(LinearLayout.VERTICAL);
                  controlsBar.setBackgroundColor(Color.parseColor("#CC080D18"));
                  controlsBar.setPadding(36, 24, 36, 28);

                  titleView = new TextView(this);
                  titleView.setText(videoTitle != null ? videoTitle : "JJ Movies TV");
                  titleView.setTextColor(Color.WHITE);
                  titleView.setTextSize(18f);

                  LinearLayout seekRow = new LinearLayout(this);
                  seekRow.setOrientation(LinearLayout.HORIZONTAL);
                  seekRow.setGravity(Gravity.CENTER_VERTICAL);
                  seekRow.setPadding(0, 12, 0, 12);

                  seekBar = new SeekBar(this);
                  seekBar.setMax(1000);
                  LinearLayout.LayoutParams sbParams = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  sbParams.setMarginEnd(18);
                  seekBar.setLayoutParams(sbParams);

                  timeView = new TextView(this);
                  timeView.setText("00:00 / 00:00");
                  timeView.setTextColor(Color.LTGRAY);
                  timeView.setTextSize(14f);

                  seekRow.addView(seekBar);
                  seekRow.addView(timeView);

                  LinearLayout btnRow = new LinearLayout(this);
                  btnRow.setOrientation(LinearLayout.HORIZONTAL);
                  btnRow.setGravity(Gravity.CENTER_VERTICAL);

                  Button rewBtn = makeControlBtn("-10s");
                  Button playPauseBtn = makeControlBtn("Play/Pause");
                  Button fwdBtn = makeControlBtn("+10s");
                  Button exitBtn = makeControlBtn("Exit");

                  rewBtn.setOnClickListener(v -> seekBy(-10000L));
                  playPauseBtn.setOnClickListener(v -> togglePlayPause());
                  fwdBtn.setOnClickListener(v -> seekBy(10000L));
                  exitBtn.setOnClickListener(v -> finish());

                  btnRow.addView(rewBtn);
                  btnRow.addView(playPauseBtn);
                  btnRow.addView(fwdBtn);
                  btnRow.addView(exitBtn);

                  controlsBar.addView(titleView);
                  controlsBar.addView(seekRow);
                  controlsBar.addView(btnRow);

                  FrameLayout.LayoutParams barParams = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM
                  );
                  root.addView(controlsBar, barParams);
                  setContentView(root);

                  playPauseBtn.requestFocus();

                  seekBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar sb, int progress, boolean fromUser) {
                          if (fromUser && mediaPlayer != null && mediaPlayer.getLength() > 0) {
                              long target = (mediaPlayer.getLength() * progress) / 1000L;
                              timeView.setText(formatMs(target) + " / " + formatMs(mediaPlayer.getLength()));
                          }
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar sb) {
                          isSeeking = true;
                      }

                      @Override
                      public void onStopTrackingTouch(SeekBar sb) {
                          if (mediaPlayer != null && mediaPlayer.getLength() > 0) {
                              mediaPlayer.setTime((mediaPlayer.getLength() * sb.getProgress()) / 1000L);
                          }
                          isSeeking = false;
                      }
                  });

                  ArrayList<String> args = new ArrayList<>();
                  args.add("--aout=opensles");
                  args.add("--audio-time-stretch");

                  libVlc = new LibVLC(this, args);
                  mediaPlayer = new MediaPlayer(libVlc);
                  mediaPlayer.attachViews(videoLayout, null, true, false);

                  if (videoUrl != null && !videoUrl.isEmpty()) {
                      Media media = new Media(libVlc, Uri.parse(videoUrl));
                      media.setHWDecoderEnabled(true, false);
                      mediaPlayer.setMedia(media);
                      media.release();
                      mediaPlayer.play();
                  }

                  handler.post(progressRunnable);
              }

              private Button makeControlBtn(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundColor(Color.parseColor("#1E293B"));
                  b.setPadding(24, 12, 24, 12);
                  b.setFocusable(true);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  lp.setMarginEnd(14);
                  b.setLayoutParams(lp);
                  return b;
              }

              private void togglePlayPause() {
                  if (mediaPlayer == null) return;
                  if (mediaPlayer.isPlaying()) mediaPlayer.pause();
                  else mediaPlayer.play();
              }

              private void seekBy(long deltaMs) {
                  if (mediaPlayer == null) return;
                  long next = Math.max(0L, mediaPlayer.getTime() + deltaMs);
                  long len = mediaPlayer.getLength();
                  if (len > 0) next = Math.min(len, next);
                  mediaPlayer.setTime(next);
              }

              private String formatMs(long ms) {
                  long totalSec = Math.max(0L, ms / 1000L);
                  long mins = totalSec / 60L;
                  long secs = totalSec % 60L;
                  return String.format("%02d:%02d", mins, secs);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE) {
                      togglePlayPause();
                      return true;
                  }
                  if (keyCode == KeyEvent.KEYCODE_MEDIA_REWIND) {
                      seekBy(-10000L);
                      return true;
                  }
                  if (keyCode == KeyEvent.KEYCODE_MEDIA_FAST_FORWARD) {
                      seekBy(10000L);
                      return true;
                  }
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      finish();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  handler.removeCallbacks(progressRunnable);
                  if (mediaPlayer != null) {
                      mediaPlayer.stop();
                      mediaPlayer.detachViews();
                      mediaPlayer.release();
                      mediaPlayer = null;
                  }
                  if (libVlc != null) {
                      libVlc.release();
                      libVlc = null;
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jjmovies.tv'
              compileSdk 34

              defaultConfig {
                  applicationId "com.jjmovies.tv"
                  minSdk 21
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "${VER_NAME}"
                  ndk {
                      abiFilters "armeabi-v7a", "arm64-v8a"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  jniLibs {
                      pickFirsts.add("**/*.so")
                  }
              }
          }

          dependencies {
              implementation project(':capacitor-android')
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation('org.videolan.android:libvlc-all:3.6.0') {
                  exclude group: 'androidx.legacy', module: 'legacy-support-v4'
              }
              implementation 'androidx.legacy:legacy-support-v4:1.0.0'
          }
          EOF

          if [ -f "android/capacitor.settings.gradle" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${VER_CODE}/" android/app/build.gradle || true
          fi

      - name: Build Debug TV APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jj-movies-tv-v${{ github.event.inputs.app_version || '1.0.0' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
