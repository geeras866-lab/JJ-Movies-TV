name: Build JJ Movies TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Android TV versionCode (integer, e.g. 1)"
        required: true
        default: "1"

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare Web Assets for JJ Movies TV
        run: |
          rm -rf www
          mkdir -p www

          copy_root() {
            for f in *; do
              case "$f" in
                www|android|node_modules|.git|.github|assets|capacitor.config.json) continue ;;
                *.apk|*.aab|*.zip|*.keystore|*.jks) continue ;;
                *)
                  if [ -e "$f" ]; then
                    cp -r "$f" www/
                  fi
                  ;;
              esac
            done
          }

          if [ -f index.html ]; then
            copy_root
          else
            IDX=$(find . -name index.html -not -path "./node_modules/*" -not -path "./android/*" -not -path "./www/*" -not -path "./.git/*" | head -n 1)
            if [ -n "$IDX" ]; then
              SRC=$(dirname "$IDX")
              cp -r "$SRC"/. www/
            else
              HTML=$(ls *.html 2>/dev/null | head -n 1 || true)
              if [ -n "$HTML" ]; then
                copy_root
                cp "$HTML" www/index.html
              fi
            fi
          fi

          if [ ! -f www/index.html ]; then
            echo "ERROR: no HTML entry file found in repo"
            exit 1
          fi

          rm -f www/package.json www/package-lock.json
          if [ ! -f package.json ]; then
            npm init -y >/dev/null 2>&1
          fi
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/screen-orientation@7

      - name: Initialize or Update Android TV Capacitor Project
        run: |
          VER_NAME="${{ github.event.inputs.app_version || '1.0.0' }}"
          VER_CODE="${{ github.event.inputs.version_code || '1' }}"

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.jjmovies.tv",
            "appName": "JJ Movies TV",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap copy android

          if [ -d "assets" ]; then
            npm install --no-save @capacitor/assets || true
            npx capacitor-assets generate --android --iconBackgroundColor '#080d18' --splashBackgroundColor '#080d18' || true
          fi

          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JJ-Movies-TV"
          include ':app'
          include ':capacitor-android'
          project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
          EOF

          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i "s/applicationId \"[^\"]*\"/applicationId \"com.jjmovies.tv\"/" "$GRADLE"
            sed -i "s/versionCode [0-9]*/versionCode ${VER_CODE}/" "$GRADLE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VER_NAME}\"/" "$GRADLE"
          fi

          STR="android/app/src/main/res/values/strings.xml"
          if [ -f "$STR" ]; then
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">JJ Movies TV</string>|' "$STR"
            sed -i 's|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">JJ Movies TV</string>|' "$STR"
          fi

      - name: Configure TV Manifest, Gradle & Native LibVLC Player
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:banner="@mipmap/ic_launcher"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".VlcPlayerActivity"
                      android:exported="false"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|screenLayout|uiMode" />

              </application>
          </manifest>
          EOF

          PKG_DIR="android/app/src/main/java/com/jjmovies/tv"
          mkdir -p "$PKG_DIR"

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.jjmovies.tv;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String SITE_URL = "https://jj-movies.pages.dev/?tv=1";

              public class TvBridge {
                  @JavascriptInterface
                  public void playVideo(String url) {
                      playVideo(url, "JJ Movies TV");
                  }

                  @JavascriptInterface
                  public void playVideo(String url, String title) {
                      if (url == null || url.trim().isEmpty()) return;
                      runOnUiThread(() -> {
                          Intent intent = new Intent(MainActivity.this, VlcPlayerActivity.class);
                          intent.putExtra("VIDEO_URL", url.trim());
                          intent.putExtra("VIDEO_TITLE", title != null ? title : "JJ Movies TV");
                          startActivity(intent);
                      });
                  }

                  @JavascriptInterface
                  public int getAppVersionCode() {
                      try {
                          return getPackageManager().getPackageInfo(getPackageName(), 0).versionCode;
                      } catch (Exception e) {
                          return 1;
                      }
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.BLACK);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setUserAgentString("Mozilla/5.0 (Linux; Android 11; Android TV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36 JJTV");

                  TvBridge bridge = new TvBridge();
                  webView.addJavascriptInterface(bridge, "AndroidVlc");
                  webView.addJavascriptInterface(bridge, "AndroidTV");

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectTvNavigation();
                      }
                  });

                  webView.requestFocus();
                  webView.loadUrl(SITE_URL);
              }

              private void injectTvNavigation() {
                  String js = "(function(){"
                      + "if(window.__jjTvInit) return; window.__jjTvInit = true;"
                      + "const style = document.createElement('style');"
                      + "style.innerHTML = `"
                      + "  *:focus, .tv-focus { outline: 3px solid #00f0ff !important; box-shadow: 0 0 18px #00f0ff !important; transform: scale(1.04); transition: transform 0.15s ease; z-index: 9999; }"
                      + "  body { cursor: none; }"
                      + "`;"
                      + "document.head.appendChild(style);"
                      + "function hookVideos(){"
                      + "  document.querySelectorAll('video').forEach(v => {"
                      + "    if(v.__vlcHooked) return; v.__vlcHooked = true;"
                      + "    v.addEventListener('play', () => {"
                      + "      const src = v.currentSrc || v.src;"
                      + "      if(src && window.AndroidVlc){ v.pause(); window.AndroidVlc.playVideo(src, document.title || 'JJ Movies TV'); }"
                      + "    });"
                      + "  });"
                      + "}"
                      + "function makeFocusable(){"
                      + "  document.querySelectorAll('a, button, input, [onclick], .movie-card, .card').forEach(el => {"
                      + "    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');"
                      + "  });"
                      + "  hookVideos();"
                      + "}"
                      + "makeFocusable();"
                      + "new MutationObserver(makeFocusable).observe(document.body, {childList:true, subtree:true});"
                      + "document.addEventListener('keydown', function(e){"
                      + "  const focusables = Array.from(document.querySelectorAll('[tabindex=\"0\"], a, button, input')).filter(el => el.offsetParent !== null);"
                      + "  if(!focusables.length) return;"
                      + "  let curr = document.activeElement;"
                      + "  if(!focusables.includes(curr)){ focusables[0].focus(); return; }"
                      + "  const rect = curr.getBoundingClientRect();"
                      + "  let best = null, bestDist = Infinity;"
                      + "  const dir = e.key;"
                      + "  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(dir)){"
                      + "    e.preventDefault();"
                      + "    focusables.forEach(el => {"
                      + "      if(el === curr) return;"
                      + "      const r = el.getBoundingClientRect();"
                      + "      const dx = (r.left + r.width/2) - (rect.left + rect.width/2);"
                      + "      const dy = (r.top + r.height/2) - (rect.top + rect.height/2);"
                      + "      if(dir==='ArrowRight' && dx <= 10) return;"
                      + "      if(dir==='ArrowLeft' && dx >= -10) return;"
                      + "      if(dir==='ArrowDown' && dy <= 10) return;"
                      + "      if(dir==='ArrowUp' && dy >= -10) return;"
                      + "      const dist = (dir==='ArrowLeft'||dir==='ArrowRight') ? Math.abs(dx) + Math.abs(dy)*3 : Math.abs(dy) + Math.abs(dx)*3;"
                      + "      if(dist < bestDist){ bestDist = dist; best = el; }"
                      + "    });"
                      + "    if(best){ best.focus(); best.scrollIntoView({behavior:'smooth', block:'center', inline:'center'}); }"
                      + "  } else if(dir === 'Enter'){"
                      + "    curr.click();"
                      + "  }"
                      + "});"
                      + "})();";
                  webView.evaluateJavascript(js, null);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/VlcPlayerActivity.java"
          package com.jjmovies.tv;

          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.widget.Toast;

          import org.videolan.libvlc.LibVLC;
          import org.videolan.libvlc.Media;
          import org.videolan.libvlc.MediaPlayer;
          import org.videolan.libvlc.util.VLCVideoLayout;

          import java.util.ArrayList;

          public class VlcPlayerActivity extends Activity {
              private LibVLC libVLC;
              private MediaPlayer mediaPlayer;
              private VLCVideoLayout videoLayout;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  videoLayout = new VLCVideoLayout(this);
                  setContentView(videoLayout);

                  String videoUrl = getIntent().getStringExtra("VIDEO_URL");
                  if (videoUrl == null || videoUrl.isEmpty()) {
                      Toast.makeText(this, "No video URL found", Toast.LENGTH_SHORT).show();
                      finish();
                      return;
                  }

                  ArrayList<String> options = new ArrayList<>();
                  options.add("--network-caching=1500");
                  options.add("--aout=audiotrack");
                  options.add("--avcodec-hw=any");

                  libVLC = new LibVLC(this, options);
                  mediaPlayer = new MediaPlayer(libVLC);
                  mediaPlayer.attachViews(videoLayout, null, false, false);

                  Media media = new Media(libVLC, Uri.parse(videoUrl));
                  media.setHWDecoderEnabled(true, false);
                  mediaPlayer.setMedia(media);
                  media.release();
                  mediaPlayer.play();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (mediaPlayer == null) return super.onKeyDown(keyCode, event);

                  switch (keyCode) {
                      case KeyEvent.KEYCODE_DPAD_CENTER:
                      case KeyEvent.KEYCODE_ENTER:
                      case KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE:
                          if (mediaPlayer.isPlaying()) {
                              mediaPlayer.pause();
                              Toast.makeText(this, "Paused", Toast.LENGTH_SHORT).show();
                          } else {
                              mediaPlayer.play();
                              Toast.makeText(this, "Playing", Toast.LENGTH_SHORT).show();
                          }
                          return true;

                      case KeyEvent.KEYCODE_DPAD_RIGHT:
                      case KeyEvent.KEYCODE_MEDIA_FAST_FORWARD:
                          mediaPlayer.setTime(mediaPlayer.getTime() + 10000);
                          Toast.makeText(this, "+10s", Toast.LENGTH_SHORT).show();
                          return true;

                      case KeyEvent.KEYCODE_DPAD_LEFT:
                      case KeyEvent.KEYCODE_MEDIA_REWIND:
                          mediaPlayer.setTime(Math.max(0, mediaPlayer.getTime() - 10000));
                          Toast.makeText(this, "-10s", Toast.LENGTH_SHORT).show();
                          return true;

                      case KeyEvent.KEYCODE_DPAD_UP:
                      case KeyEvent.KEYCODE_MENU:
                          switchAudioTrack();
                          return true;

                      case KeyEvent.KEYCODE_BACK:
                          finish();
                          return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              private void switchAudioTrack() {
                  MediaPlayer.TrackDescription[] tracks = mediaPlayer.getAudioTracks();
                  if (tracks == null || tracks.length <= 1) {
                      Toast.makeText(this, "Single audio track", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  int currentId = mediaPlayer.getAudioTrack();
                  int nextIndex = 0;
                  for (int i = 0; i < tracks.length; i++) {
                      if (tracks[i].id == currentId) {
                          nextIndex = (i + 1) % tracks.length;
                          break;
                      }
                  }
                  mediaPlayer.setAudioTrack(tracks[nextIndex].id);
                  Toast.makeText(this, "Audio: " + tracks[nextIndex].name, Toast.LENGTH_SHORT).show();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (mediaPlayer != null) {
                      mediaPlayer.stop();
                      mediaPlayer.detachViews();
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (mediaPlayer != null) mediaPlayer.release();
                  if (libVLC != null) libVLC.release();
              }
          }
          EOF

          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${VER_CODE}/" "$GRADLE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VER_NAME}\"/" "$GRADLE"
          fi

      - name: Build Debug TV APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain || ./gradlew assembleDebug --offline --console=plain

      - name: Upload TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jj-movies-tv-v${{ github.event.inputs.app_version || '1.0.0' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
