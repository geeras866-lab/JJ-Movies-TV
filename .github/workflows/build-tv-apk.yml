name: Build JJ Movies TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Android TV versionCode (integer, e.g. 1)"
        required: true
        default: "1"

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest
    env:
      VER_NAME: ${{ github.event.inputs.app_version || '1.0.0' }}
      VER_CODE: ${{ github.event.inputs.version_code || '1' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 1. Setup Gradle, Manifest & TV Web Assets
        run: |
          rm -rf app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/jjmovies/tv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          [ -f tv.css ] && cp tv.css app/src/main/assets/tv.css
          [ -f tv.js ] && cp tv.js app/src/main/assets/tv.js
          if [ -f "assets/icon-only.png" ]; then
            cp "assets/icon-only.png" "app/src/main/assets/jj_logo.png"
          elif [ -f "assets/icon-foreground.png" ]; then
            cp "assets/icon-foreground.png" "app/src/main/assets/jj_logo.png"
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JJ-Movies-TV"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jjmovies.tv'
              compileSdk 34

              defaultConfig {
                  applicationId "com.jjmovies.tv"
                  minSdk 21
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "${VER_NAME}"
                  ndk {
                      abiFilters "armeabi-v7a", "arm64-v8a"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  jniLibs {
                      pickFirsts.add("**/*.so")
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation('org.videolan.android:libvlc-all:3.6.0') {
                  exclude group: 'androidx.legacy', module: 'legacy-support-v4'
              }
              implementation 'androidx.legacy:legacy-support-v4:1.0.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="updates" path="." />
              <cache-path name="cache_updates" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:banner="@drawable/tv_banner"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="JJ Movies TV"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.jjmovies.tv.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|screenLayout|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".EmbedPlayerActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|screenLayout|uiMode"
                      android:exported="false"
                      android:screenOrientation="landscape" />

                  <activity
                      android:name=".VlcPlayerActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|screenLayout|uiMode"
                      android:exported="false"
                      android:screenOrientation="landscape" />

              </application>
          </manifest>
          EOF

      - name: 2. Setup Icons, Audio-Subtitles Card, Resume Card & Player Layout
        run: |
          cat << 'EOF' > app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#080D18</color>
          </resources>
          EOF

          if [ -f "assets/icon-only.png" ]; then
            if command -v convert >/dev/null 2>&1; then
              convert "assets/icon-only.png" PNG32:"app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" || cp "assets/icon-only.png" "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
              convert -size 320x180 xc:"#080D18" \( "assets/icon-only.png" -resize 140x140 \) -gravity center -composite PNG32:"app/src/main/res/drawable/tv_banner.png" || cp "assets/icon-only.png" "app/src/main/res/drawable/tv_banner.png"
            else
              cp "assets/icon-only.png" "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
              cp "assets/icon-only.png" "app/src/main/res/drawable/tv_banner.png"
            fi
            cp "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" "app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png"
            for d in mdpi hdpi xhdpi xxhdpi; do
              cp "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" "app/src/main/res/mipmap-${d}/ic_launcher.png"
              cp "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" "app/src/main/res/mipmap-${d}/ic_launcher_round.png"
            done
          fi

          if [ -f "assets/icon-foreground.png" ]; then
            if command -v convert >/dev/null 2>&1; then
              convert "assets/icon-foreground.png" PNG32:"app/src/main/res/drawable/ic_launcher_foreground.png" || cp "assets/icon-foreground.png" "app/src/main/res/drawable/ic_launcher_foreground.png"
            else
              cp "assets/icon-foreground.png" "app/src/main/res/drawable/ic_launcher_foreground.png"
            fi
          elif [ -f "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" ]; then
            cp "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" "app/src/main/res/drawable/ic_launcher_foreground.png"
          fi

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat << 'EOF' > app/src/main/res/drawable/bg_buffering_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#E60D1526" />
              <stroke android:width="1.5dp" android:color="#66FF2450" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_tracks_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F0141824" />
              <stroke android:width="1dp" android:color="#33FFFFFF" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_track_item.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#33FF6B00" />
                      <stroke android:width="1.5dp" android:color="#FF6B00" />
                      <corners android:radius="8dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#00000000" />
                      <corners android:radius="8dp" />
                  </shape>
              </item>
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_resume_btn.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#E50914" />
                      <stroke android:width="2.5dp" android:color="#FFFFFF" />
                      <corners android:radius="10dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#222A3A" />
                      <stroke android:width="1dp" android:color="#44FFFFFF" />
                      <corners android:radius="10dp" />
                  </shape>
              </item>
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_play_circle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#26000000" />
              <stroke android:width="2dp" android:color="#FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_vlc_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="28dp" android:height="28dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M8,5v14l11,-7z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_vlc_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="28dp" android:height="28dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M6,19h4L10,5L6,5v14zM14,5v14h4L18,5h-4z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_vlc_back.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_vlc_tracks.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M20,4H4c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V6c0,-1.1 -0.9,-2 -2,-2zM4,12h4v2H4v-2zm10,6H4v-2h10v2zm6,0h-4v-2h4v2zm0,-4H10v-2h10v2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_vlc_aspect.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M19,12h-2v3h-3v2h5v-5zM7,9h3V7H5v5h2V9zm14,-6H3c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h18c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zm0,16.01H3V4.99h18v14.02z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_vlc_player.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/vlc_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <org.videolan.libvlc.util.VLCVideoLayout
                  android:id="@+id/vlc_video_layout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <LinearLayout
                  android:id="@+id/vlc_loading_box"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:background="@drawable/bg_buffering_card"
                  android:gravity="center"
                  android:orientation="vertical"
                  android:paddingStart="30dp"
                  android:paddingTop="22dp"
                  android:paddingEnd="30dp"
                  android:paddingBottom="22dp">

                  <ProgressBar
                      android:layout_width="44dp"
                      android:layout_height="44dp"
                      android:indeterminateTint="#FF2450" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:letterSpacing="0.14"
                      android:text="JJ MOVIES"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/tv_buffering_text"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:text="Buffering 0%"
                      android:textColor="#FF8A3D"
                      android:textSize="11sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <RelativeLayout
                  android:id="@+id/controls_overlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#55000000"
                  android:padding="24dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_alignParentTop="true"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <ImageButton
                          android:id="@+id/btn_back"
                          android:layout_width="44dp"
                          android:layout_height="44dp"
                          android:background="?android:attr/selectableItemBackgroundBorderless"
                          android:focusable="true"
                          android:src="@drawable/ic_vlc_back" />

                      <TextView
                          android:id="@+id/tv_video_title"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginHorizontal="12dp"
                          android:layout_weight="1"
                          android:ellipsize="end"
                          android:gravity="center"
                          android:singleLine="true"
                          android:text="JJ Movies TV"
                          android:textColor="#FFFFFF"
                          android:textSize="18sp"
                          android:textStyle="bold" />

                      <View
                          android:layout_width="44dp"
                          android:layout_height="44dp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_alignParentBottom="true"
                      android:orientation="vertical">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextView
                              android:id="@+id/tv_current_time"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="0:00"
                              android:textColor="#FFFFFF"
                              android:textSize="13sp" />

                          <SeekBar
                              android:id="@+id/vlc_seekbar"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginHorizontal="12dp"
                              android:layout_weight="1"
                              android:focusable="true"
                              android:progressTint="#FF6B00"
                              android:thumbTint="#FF6B00" />

                          <TextView
                              android:id="@+id/tv_total_time"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="0:00"
                              android:textColor="#CBD5E1"
                              android:textSize="13sp" />
                      </LinearLayout>

                      <RelativeLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp">

                          <ImageButton
                              android:id="@+id/btn_tracks"
                              android:layout_width="44dp"
                              android:layout_height="44dp"
                              android:layout_alignParentStart="true"
                              android:layout_centerVertical="true"
                              android:background="?android:attr/selectableItemBackgroundBorderless"
                              android:focusable="true"
                              android:src="@drawable/ic_vlc_tracks" />

                          <ImageButton
                              android:id="@+id/btn_play_pause"
                              android:layout_width="56dp"
                              android:layout_height="56dp"
                              android:layout_centerInParent="true"
                              android:background="@drawable/bg_play_circle"
                              android:focusable="true"
                              android:src="@drawable/ic_vlc_pause" />

                          <ImageButton
                              android:id="@+id/btn_aspect"
                              android:layout_width="44dp"
                              android:layout_height="44dp"
                              android:layout_alignParentEnd="true"
                              android:layout_centerVertical="true"
                              android:background="?android:attr/selectableItemBackgroundBorderless"
                              android:focusable="true"
                              android:src="@drawable/ic_vlc_aspect" />
                      </RelativeLayout>
                  </LinearLayout>
              </RelativeLayout>

              <RelativeLayout
                  android:id="@+id/resume_overlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#CC000000"
                  android:clickable="true"
                  android:visibility="gone">

                  <LinearLayout
                      android:layout_width="460dp"
                      android:layout_height="wrap_content"
                      android:layout_centerInParent="true"
                      android:background="@drawable/bg_tracks_card"
                      android:gravity="center"
                      android:orientation="vertical"
                      android:padding="26dp">

                      <TextView
                          android:id="@+id/tv_resume_title"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:ellipsize="end"
                          android:maxLines="2"
                          android:gravity="center"
                          android:text="Continue Watching?"
                          android:textColor="#FFFFFF"
                          android:textSize="18sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/tv_resume_subtitle"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:layout_marginBottom="20dp"
                          android:text="Resume from where you left off"
                          android:textColor="#CBD5E1"
                          android:textSize="13sp" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btn_resume_continue"
                              android:layout_width="0dp"
                              android:layout_height="48dp"
                              android:layout_marginEnd="10dp"
                              android:layout_weight="1"
                              android:background="@drawable/bg_resume_btn"
                              android:focusable="true"
                              android:text="▶ Continue"
                              android:textAllCaps="false"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp"
                              android:textStyle="bold" />

                          <Button
                              android:id="@+id/btn_resume_restart"
                              android:layout_width="0dp"
                              android:layout_height="48dp"
                              android:layout_marginStart="10dp"
                              android:layout_weight="1"
                              android:background="@drawable/bg_resume_btn"
                              android:focusable="true"
                              android:text="↺ Start Over"
                              android:textAllCaps="false"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </LinearLayout>
              </RelativeLayout>

              <RelativeLayout
                  android:id="@+id/tracks_overlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#80000000"
                  android:clickable="true"
                  android:focusable="false"
                  android:padding="28dp"
                  android:visibility="gone">

                  <LinearLayout
                      android:id="@+id/tracks_card"
                      android:layout_width="640dp"
                      android:layout_height="wrap_content"
                      android:layout_centerInParent="true"
                      android:background="@drawable/bg_tracks_card"
                      android:clickable="true"
                      android:orientation="horizontal"
                      android:padding="22dp">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical"
                          android:paddingEnd="14dp">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginBottom="12dp"
                              android:text="Audio"
                              android:textColor="#FFFFFF"
                              android:textSize="17sp"
                              android:textStyle="bold" />

                          <ScrollView
                              android:layout_width="match_parent"
                              android:layout_height="190dp"
                              android:scrollbars="none">

                              <LinearLayout
                                  android:id="@+id/audio_tracks_container"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="vertical" />
                          </ScrollView>
                      </LinearLayout>

                      <View
                          android:layout_width="1dp"
                          android:layout_height="match_parent"
                          android:background="#2A3142" />

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical"
                          android:paddingStart="16dp">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
