          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#080D18" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
