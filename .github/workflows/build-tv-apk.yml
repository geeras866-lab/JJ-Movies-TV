          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.ByteArrayInputStream;
          import java.util.Locale;

          public class EmbedPlayerActivity extends AppCompatActivity {

              public static final String EXTRA_EMBED_URL = "embed_url";
              public static final String EXTRA_EMBED_TITLE = "embed_title";

              private WebView embedWebView;
              private View pointerView;
              private TextView hintBadge;
              private float cursorX = -1f;
              private float cursorY = -1f;
              private boolean pointerActive = false;

              private boolean isAdHost(String url) {
                  if (url == null) return false;
                  String u = url.toLowerCase(Locale.US);
                  return u.contains("doubleclick.net")
                      || u.contains("googlesyndication.com")
                      || u.contains("popads.net")
                      || u.contains("popcash.net")
                      || u.contains("propellerads")
                      || u.contains("adsterra")
                      || u.contains("exoclick")
                      || u.contains("trafficjunky")
                      || u.contains("juicyads")
                      || u.contains("clickadu")
                      || u.contains("hilltopads")
                      || u.contains("monetag")
                      || u.contains("acscdn")
                      || u.contains("histats.com");
              }

              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }

              private void ensureCursorInitialized(View container) {
                  int w = container.getWidth();
                  int h = container.getHeight();
                  if (w <= 0 || h <= 0) return;
                  if (cursorX < 0 || cursorY < 0) {
                      cursorX = w / 2f;
                      cursorY = h / 2f;
                  }
                  cursorX = Math.max(8f, Math.min(w - 8f, cursorX));
                  cursorY = Math.max(8f, Math.min(h - 8f, cursorY));
                  pointerActive = true;
                  pointerView.setVisibility(View.VISIBLE);
                  pointerView.setTranslationX(cursorX - 14f);
                  pointerView.setTranslationY(cursorY - 14f);
                  if (hintBadge != null) {
                      hintBadge.setVisibility(View.VISIBLE);
                  }
              }

              private void moveCursorBy(float dx, float dy) {
                  View root = findViewById(android.R.id.content);
                  if (root == null) return;
                  cursorX += dx;
                  cursorY += dy;
                  ensureCursorInitialized(root);
                  long now = SystemClock.uptimeMillis();
                  MotionEvent hover = MotionEvent.obtain(now, now, MotionEvent.ACTION_HOVER_MOVE, cursorX, cursorY, 0);
                  embedWebView.dispatchGenericMotionEvent(hover);
                  hover.recycle();
              }

              private void clickAtCursor() {
                  View root = findViewById(android.R.id.content);
                  if (root == null) return;
                  ensureCursorInitialized(root);
                  long now = SystemClock.uptimeMillis();
                  MotionEvent down = MotionEvent.obtain(now, now, MotionEvent.ACTION_DOWN, cursorX, cursorY, 0);
                  MotionEvent up = MotionEvent.obtain(now, now + 45, MotionEvent.ACTION_UP, cursorX, cursorY, 0);
                  embedWebView.dispatchTouchEvent(down);
                  embedWebView.dispatchTouchEvent(up);
                  down.recycle();
                  up.recycle();
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemUi();

                  String embedUrl = getIntent().getStringExtra(EXTRA_EMBED_URL);
                  if (embedUrl == null || embedUrl.trim().isEmpty()) {
                      Toast.makeText(this, "Invalid stream URL", Toast.LENGTH_SHORT).show();
                      finish();
                      return;
                  }

                  FrameLayout container = new FrameLayout(this);
                  container.setBackgroundColor(Color.BLACK);

                  embedWebView = new WebView(this);
                  embedWebView.setBackgroundColor(Color.BLACK);
                  container.addView(embedWebView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ));

                  GradientDrawable cursorCircle = new GradientDrawable();
                  cursorCircle.setShape(GradientDrawable.OVAL);
                  cursorCircle.setColor(Color.parseColor("#66FF2450"));
                  cursorCircle.setStroke(4, Color.WHITE);

                  pointerView = new View(this);
                  pointerView.setBackground(cursorCircle);
                  pointerView.setVisibility(View.GONE);
                  FrameLayout.LayoutParams pParams = new FrameLayout.LayoutParams(28, 28);
                  pParams.gravity = Gravity.TOP | Gravity.START;
                  container.addView(pointerView, pParams);

                  hintBadge = new TextView(this);
                  hintBadge.setText("D-Pad: Move Pointer  •  OK: Click Play  •  Back: Exit");
                  hintBadge.setTextColor(Color.WHITE);
                  hintBadge.setTextSize(12f);
                  hintBadge.setBackgroundColor(Color.parseColor("#B3080D18"));
                  hintBadge.setPadding(24, 10, 24, 10);
                  hintBadge.setVisibility(View.GONE);
                  FrameLayout.LayoutParams hParams = new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT
                  );
                  hParams.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  hParams.topMargin = 20;
                  container.addView(hintBadge, hParams);

                  setContentView(container);

                  WebSettings s = embedWebView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36");

                  embedWebView.setWebChromeClient(new WebChromeClient());
                  embedWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          if (request != null && request.getUrl() != null && isAdHost(request.getUrl().toString())) {
                              return new WebResourceResponse("text/plain", "UTF-8", new ByteArrayInputStream(new byte[0]));
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (request != null && request.getUrl() != null && isAdHost(request.getUrl().toString())) {
                              return true;
                          }
                          return false;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          container.postDelayed(() -> ensureCursorInitialized(container), 400);
                      }
                  });

                  embedWebView.loadUrl(embedUrl.trim());
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int action = event.getAction();
                  int code = event.getKeyCode();

                  if (code == KeyEvent.KEYCODE_BACK) {
                      if (action == KeyEvent.ACTION_DOWN) finish();
                      return true;
                  }

                  float step = event.getRepeatCount() > 2 ? 56f : 32f;

                  if (code == KeyEvent.KEYCODE_DPAD_UP) {
                      if (action == KeyEvent.ACTION_DOWN) moveCursorBy(0f, -step);
                      return true;
                  }
                  if (code == KeyEvent.KEYCODE_DPAD_DOWN) {
                      if (action == KeyEvent.ACTION_DOWN) moveCursorBy(0f, step);
                      return true;
                  }
                  if (code == KeyEvent.KEYCODE_DPAD_LEFT) {
                      if (action == KeyEvent.ACTION_DOWN) moveCursorBy(-step, 0f);
                      return true;
                  }
                  if (code == KeyEvent.KEYCODE_DPAD_RIGHT) {
                      if (action == KeyEvent.ACTION_DOWN) moveCursorBy(step, 0f);
                      return true;
                  }
                  if (code == KeyEvent.KEYCODE_DPAD_CENTER || code == KeyEvent.KEYCODE_ENTER) {
                      if (action == KeyEvent.ACTION_DOWN) {
                          if (!pointerActive) {
                              View root = findViewById(android.R.id.content);
                              if (root != null) ensureCursorInitialized(root);
                          }
                          clickAtCursor();
                      }
                      return true;
                  }

                  return super.dispatchKeyEvent(event);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  hideSystemUi();
              }
          }
