name: Build JJ Movies TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Android TV versionCode (integer, e.g. 1)"
        required: true
        default: "1"

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest
    env:
      VER_NAME: ${{ github.event.inputs.app_version || '1.0.0' }}
      VER_CODE: ${{ github.event.inputs.version_code || '1' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 1. Setup Gradle, Manifest & TV Web Assets
        run: |
          rm -rf app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/jjmovies/tv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          [ -f tv.css ] && cp tv.css app/src/main/assets/tv.css
          [ -f tv.js ] && cp tv.js app/src/main/assets/tv.js

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JJ-Movies-TV"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jjmovies.tv'
              compileSdk 34

              defaultConfig {
                  applicationId "com.jjmovies.tv"
                  minSdk 21
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "${VER_NAME}"
                  ndk {
                      abiFilters "armeabi-v7a", "arm64-v8a"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  jniLibs {
                      pickFirsts.add("**/*.so")
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation('org.videolan.android:libvlc-all:3.6.0') {
                  exclude group: 'androidx.legacy', module: 'legacy-support-v4'
              }
              implementation 'androidx.legacy:legacy-support-v4:1.0.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:banner="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="JJ Movies TV"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|screenLayout|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".VlcPlayerActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|screenLayout|uiMode"
                      android:exported="false"
                      android:screenOrientation="landscape" />

              </application>
          </manifest>
          EOF

      - name: 2. Setup TV Icons, Buffering Card & Player Layout
        run: |
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
